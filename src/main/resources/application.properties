# ─────────────────────────────────────────────────────────────────────────────
# FeastFlow — Configuration
# Local dev: MySQL | Production (Railway): Supabase PostgreSQL via env vars
# ─────────────────────────────────────────────────────────────────────────────

server.port=${PORT:9090}
spring.application.name=restaurant-ordering-system

# ─── Database (env-var driven, local MySQL fallback) ─────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:@2006}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── Connection Pool ──────────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:feastflow-super-secret-key-change-in-production-min-64-chars!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-enums-using-to-string=true
