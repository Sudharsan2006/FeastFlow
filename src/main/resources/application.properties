# ─────────────────────────────────────────────────────────────────────────────
# FeastFlow — Supabase PostgreSQL + JWT Configuration
# Uses environment variables with local fallback values
# ─────────────────────────────────────────────────────────────────────────────

server.port=${PORT:9090}
spring.application.name=restaurant-ordering-system

# ─── PostgreSQL / Supabase Database ─────────────────────────────────────────
# Set these env vars in Railway:
#   DB_URL      = jdbc:postgresql://db.wxhmwrqfzrivbqclwvcc.supabase.co:5432/postgres
#   DB_USER     = postgres
#   DB_PASSWORD = <your-supabase-db-password>
spring.datasource.url=${DB_URL:jdbc:postgresql://db.wxhmwrqfzrivbqclwvcc.supabase.co:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Connection Pool ──────────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Set JWT_SECRET in Railway to a 64+ char random string
jwt.secret=${JWT_SECRET:feastflow-super-secret-key-change-in-production-min-64-chars!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-enums-using-to-string=true
